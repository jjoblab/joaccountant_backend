# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# R-36 (lot-D-qualite-arch) — suppression des propriétés android.* résiduelles
# (android.nonTransitiveRClass, android.useAndroidX, android.signingConfig.*) :
# ce projet Spring Boot multi-module Gradle ne cible pas Android, ces propriétés
# n'avaient aucun effet (résidus d'un template Gradle Android). Conservé : propriétés
# utiles au build JVM (caching, parallel, daemon, jvmargs, encoding).

kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
