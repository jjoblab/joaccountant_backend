# Render deployment configuration for JOAccountant backend
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: joaccountant-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: joaccountant-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: joaccountant-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: joaccountant-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: joaccountant-db
    databaseName: joaccountant
    plan: free
    postgresqlVersion: 16
