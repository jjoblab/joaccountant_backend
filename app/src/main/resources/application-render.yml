# ============================================================
# Profil Render — Adapté au free tier (512 MB RAM)
# ============================================================
# Activé via SPRING_PROFILES_ACTIVE=render
#
# Corrections v8.2 (par rapport à la version précédente) :
#   1. server.port → ${PORT:8080} pour écouter sur le port injecté par Render
#      (Render attend que l'app écoute sur $PORT — défaut 10000 — pas 8080)
#   2. management.server.port → désactivé (utilise le port principal)
#      Render ne forward qu'un seul port vers l'extérieur ; un port management
#      séparé (8081) serait inaccessible depuis le load balancer Render.
#   3. spring.datasource.url → ${SPRING_DATASOURCE_URL} (renseigné par docker-entrypoint.sh
#      qui convertit DATABASE_URL de Render en format JDBC)
#   4. app.jwt.secret → ${JWT_SECRET} (au lieu de ${APP_JWT_SECRET}) pour matcher
#      le nom de variable défini dans render.yaml
#
# Variables d'environnement OBLIGATOIRES :
#   - DATABASE_URL (injecté par Render depuis le PostgreSQL lié — format postgres://)
#   - JWT_SECRET (≥ 32 caractères aléatoires — à saisir dans le dashboard Render)
#   - ENCRYPTION_KEY (32 caractères — à saisir dans le dashboard Render)
#   - PORT (injecté automatiquement par Render — défaut 10000)
#   - CORS_ALLOWED_ORIGINS (défaut * accepté en render, à restreindre en prod)
# ============================================================

# ─── Port & serveur ───────────────────────────────────────────────
# Render injecte PORT (défaut 10000) — l'app DOIT écouter dessus.
# Sans cela, Render affiche "No open ports detected" et restart en boucle.
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: NATIVE  # Render est derrière un reverse proxy HTTPS
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

# ─── Management sur le MÊME port que l'app ───────────────────────
# En render, on désactive le port management séparé (Render ne forward qu'un port).
# Les endpoints /actuator/* restent accessibles sur le port principal.
management:
  server:
    port:  # vide = même port que server.port (désactive le port management séparé)
  endpoint:
    health:
      show-details: always  # Render health check a besoin de détails pour diagnostiquer
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spring:
  # ─── Datasource (URL fournie par docker-entrypoint.sh qui convertit DATABASE_URL) ───
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      # Free tier = 512 MB RAM. Pool réduit pour éviter OOM.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:30000}
      max-lifetime: 1800000      # 30 min
      idle-timeout: 600000       # 10 min
      connection-timeout: 30000  # 30 s
      connection-test-query: "SELECT 1"
      validation-timeout: 5000

  jpa:
    properties:
      hibernate:
        format_sql: false
        # Batch inserts/updates pour réduire le nombre de requêtes (perf free tier)
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    # Render : on démarre sur DB vide → baseline-on-migrate OK
    baseline-on-migrate: true
    baseline-version: 0
    # FIX v8.2 : désactiver la validation des checksums au démarrage.
    # Si une migration a été modifiée (ex: V0_000 corrigée pour PG 18), Flyway ne bloquera pas.
    # En prod réel, remettre à true et utiliser `flyway repair` pour aligner les checksums.
    validate-on-migrate: false
    clean-disabled: false   # Permet de reset en dev (jamais en prod réel)

springdoc:
  swagger-ui:
    enabled: true    # Activé en render pour valider l'API déployée
  api-docs:
    enabled: true

logging:
  level:
    jo.accountant: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO

# ─── JWT & Encryption ─────────────────────────────────────────────
# Variables alignées avec render.yaml (JWT_SECRET, ENCRYPTION_KEY)
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # FIX v8.2 : storage root doit être writable par l'user non-root joaccountant
  # /app appartient à root → on utilise /tmp/uploads (créé par Dockerfile avec joaccountant ownership)
  storage:
    fs:
      root: ${APP_STORAGE_ROOT:/tmp/uploads}
