spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:${embedded.postgres.port}/joaccountant
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # v2.5.2 — dialect retiré (HHH90000025 : Hibernate 6 détecte automatiquement le dialecte via le JDBC driver)
        # dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

app:
  jwt:
    secret: test-secret-please-do-not-use-in-production-256-bits-minimum-1234567890
    access-token-ttl-seconds: 900
  subscription:
    max-companies-per-user: 3
  storage:
    fs:
      root: ./build/storage-test

logging:
  level:
    jo.accountant: WARN
    org.hibernate.SQL: WARN
