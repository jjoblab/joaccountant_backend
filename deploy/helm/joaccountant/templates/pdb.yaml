{{- if .Values.podDisruptionBudget.enabled }}
# ===================================================================
# PodDisruptionBudget — protège contre les drainages de node
# Audit §9.4 (Lot E) — durcissement Helm chart K8s
# ===================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "joaccountant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joaccountant.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "joaccountant.selectorLabels" . | nindent 6 }}
{{- end }}
