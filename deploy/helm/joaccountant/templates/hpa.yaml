{{/*
=====================================================================
JOAccountant Backend — HorizontalPodAutoscaler
Finding #22 (Helm chart)
=====================================================================
Autoscaling CPU 70%, 2→10 replicas. Behavior:
  - scale-up : aggressive (100%/30s) pour absorber les pics d'usage (clôture mensuelle)
  - scale-down: conservateur (50%/60s, stabilization 5min) pour éviter le thrashing
*/}}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "joaccountant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joaccountant.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "joaccountant.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
