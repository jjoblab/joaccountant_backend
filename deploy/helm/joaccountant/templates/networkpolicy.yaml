{{- if .Values.networkPolicy.enabled }}
# ===================================================================
# NetworkPolicy — isole les pods backend en ingress/egress
# Audit §9.4 (Lot E) — durcissement Helm chart K8s
# ===================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "joaccountant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joaccountant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "joaccountant.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Autoriser ingress HTTP/8080 depuis les Ingress/LB uniquement
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Autoriser ingress métriques/8081 depuis les pods Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Autoriser DNS (kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Autoriser PostgreSQL (port 5432) — vers pods postgresql OU service externe
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Autoriser Redis (port 6379) — pour bucket4j-redis + cache L2
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Autoriser HTTPS sortant (S3, OTLP exporter, package repositories)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
