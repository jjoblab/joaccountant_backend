{{/*
=====================================================================
JOAccountant Backend — Service (ClusterIP)
Finding #22 (Helm chart) + Audit §9.4 (Lot E — ServiceMonitor)
=====================================================================
Expose le port 8080 (API + Swagger UI) sur le réseau interne du cluster.
Expose aussi le port 8081 (actuator / Prometheus) pour le ServiceMonitor
Prometheus Operator (préféré aux podAnnotations).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "joaccountant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joaccountant.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-api
      port: {{ .Values.service.port }}
      targetPort: http-api
      protocol: TCP
      appProtocol: http
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "joaccountant.selectorLabels" . | nindent 4 }}
