{{/*
=====================================================================
JOAccountant Backend — Secret (DB_PASSWORD + APP_JWT_SECRET)
Finding #22 (Helm chart)
=====================================================================
Généré UNIQUEMENT si secrets.existingSecret est vide — sinon, le secret
doit être créé en dehors du chart (External Secrets Operator, Vault, Sealed
Secrets, etc.) pour éviter de stocker des credentials en clair dans values.
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "joaccountant.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joaccountant.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ required "secrets.dbPassword est OBLIGATOIRE (ou fournir secrets.existingSecret)" .Values.secrets.dbPassword | b64enc | quote }}
  APP_JWT_SECRET: {{ required "secrets.jwtSecret est OBLIGATOIRE (ou fournir secrets.existingSecret) — min 256 bits" .Values.secrets.jwtSecret | b64enc | quote }}
{{- end }}
